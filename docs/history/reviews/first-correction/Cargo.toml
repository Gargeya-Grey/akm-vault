[package]
name = "akm-phase1-review-probes"
version = "0.0.0"
edition = "2021"

[dependencies]
akm-core = { path = "W:/API Keys Manager/crates/akm-core" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
arboard = "3.7"
fs2 = "0.4"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading"] }
