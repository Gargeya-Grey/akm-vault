[package]
name = "akm-cli"
description = "Command line frontend for the API Keys Manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "akm"
path = "src/main.rs"

[dependencies]
akm-core = { path = "../akm-core" }
chrono.workspace = true
clap.workspace = true
dirs.workspace = true
rpassword.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
keepass.workspace = true
tempfile = "3"
