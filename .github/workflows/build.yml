name: Windows development build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      # The default temp path holds the short name RUNNER~1, and four desktop tests compare
      # raw temp paths with canonical ones (FINDINGS.md P2R2-06). RUNNER_TEMP has no short names.
      - name: Use a temp folder without short names
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$env:RUNNER_TEMP" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tools/test_check_docs.py reads two past commits
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # Pinned to the toolchain of the local checks (Cargo.toml rust-version 1.90): a newer
      # Clippy adds lints, which turned a passing branch red on 2026-11-07. Raise it on purpose.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Documentation check (stale test names, control characters)
        run: |
          python tools/check_docs.py
          python tools/test_check_docs.py
      - name: KeePassXC fetch tool never deletes what it does not own
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/test_fetch_keepassxc.ps1
      - name: Verification helper never removes a folder it did not create
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/test_akm_verify.ps1
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Frontend regressions
        working-directory: desktop
        run: npm test
      - name: Build frontend for the native crate
        working-directory: desktop
        run: npm run build
      - name: Browser UI regressions (mocked native boundary)
        working-directory: desktop
        run: npm run test:ui
      # rust-cache restores target/, including the fake test journal folder, without AKM's private
      # permissions, and AKM then refuses that journal (FINDINGS.md P2R2-06). The tests make it again.
      - name: Remove the restored test journal folder
        shell: pwsh
        run: Remove-Item -LiteralPath target/akm-test-journal -Recurse -Force -ErrorAction SilentlyContinue
      - name: Native and executable regressions
        run: cargo test --workspace --locked
      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Build Windows installers
        working-directory: desktop
        run: npm run tauri -- build -- --locked
      - name: Build CLI
        run: cargo build --release --locked -p akm-cli
      - name: Fetch pinned independent KDBX implementation
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'KeePassXC-2.8.0-x64.zip'
          Invoke-WebRequest 'https://github.com/keepassxreboot/keepassxc/releases/download/2.8.0/KeePassXC-2.8.0-x64.zip' -OutFile $zip
          $expected = '48ff4f088e9ce70e241da1270e5081528dba77c38b17dae4aa6690ffc50fc828'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'KeePassXC checksum mismatch' }
          $dir = Join-Path $env:RUNNER_TEMP 'akm-keepassxc'
          Expand-Archive $zip -DestinationPath $dir
          $cli = Get-ChildItem $dir -Recurse -Filter keepassxc-cli.exe | Select-Object -First 1
          "KPXC_CLI=$($cli.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Independent reader and writer interoperability
        run: python tools/verify_keepassxc.py --akm target/release/akm.exe --keepassxc "$env:KPXC_CLI"
      - name: No-network check
        run: |
          python tools/check_no_network.py
          python tools/test_check_no_network.py
      # tools/check_dependencies.ps1 (FINDINGS.md FR-23) needs cargo-audit and cargo-deny, which the
      # runner does not have. It looks for them in .scratch/cargo-tools/bin first, so install them
      # there, at pinned versions with --locked (both support Rust 1.90). The checks fetch the
      # advisory databases (GitHub) and the npm registry, so they need the network. Raise the pins on purpose.
      - name: Cache the pinned dependency check tools
        id: cargo-tools
        uses: actions/cache@v4
        with:
          path: .scratch/cargo-tools
          key: cargo-tools-${{ runner.os }}-cargo-deny-0.20.2-cargo-audit-0.22.2-rust-1.90.0
      - name: Install the pinned dependency check tools
        if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: cargo install --locked --root .scratch/cargo-tools cargo-deny@0.20.2 cargo-audit@0.22.2
      - name: Dependency checks (cargo audit, cargo deny, npm audit)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/check_dependencies.ps1
      - name: Third-party notices are current (FR-25)
        run: |
          python tools/generate_third_party_notices.py --check
          python tools/test_third_party_notices.py
      - name: Second KDBX reader (kdbxweb)
        working-directory: tools/verify_kdbxweb
        run: |
          npm ci
          node verify.mjs --akm ../../target/release/akm.exe
      - name: Collect development artifacts and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item target/release/akm.exe out/
          Copy-Item target/release/bundle/nsis/*-setup.exe out/
          $lines = Get-ChildItem out -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          $lines | Set-Content out/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: akm-windows-x64-untrusted-development
          path: out/*
          if-no-files-found: error
