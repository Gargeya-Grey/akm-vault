name: Native proofs on a disposable runner

# Runs the proofs that need a real Windows desktop, a real clipboard and a real installer, on
# GitHub-hosted runners, which GitHub discards after each job. Every job uses fake vaults and fake
# keys only. Manual start only: this workflow runs only after the owner approves the AGENTS.md rule
# for disposable runners (docs/TESTING.md, "Native proofs on a disposable runner").
# Each proof job starts on a new runner, checks the build against SHA256SUMS.txt, records the
# session facts (tools/ci_native_preflight.ps1), and uploads its full transcript with the build
# hashes and the commit, also when the proof fails.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-proof-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned by digest, as in build.yml. Raise both values on purpose.
  KEEPASSXC_VERSION: 2.8.0
  KEEPASSXC_SHA256: 48ff4f088e9ce70e241da1270e5081528dba77c38b17dae4aa6690ffc50fc828

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    steps:
      # No cache: each proof build starts from the lock files, so no restored state enters it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-11-13
        with:
          toolchain: 1.90.0
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Build the Windows setup program and the desktop app
        working-directory: desktop
        run: npm run tauri -- build -- --locked
      - name: Build the CLI
        run: cargo build --release --locked -p akm-cli
      - name: Build the desktop library tests (for the real clipboard test)
        shell: pwsh
        run: |
          $lines = cargo test -p akm-desktop --lib --locked --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { throw 'the desktop library tests did not build' }
          $exe = $lines | ForEach-Object { try { $_ | ConvertFrom-Json } catch { $null } } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'akm_desktop_lib' -and $_.profile.test -and $_.executable } |
            Select-Object -ExpandProperty executable -First 1
          if (-not $exe) { throw 'no test executable for akm_desktop_lib' }
          "DESKTOP_LIB_TESTS=$exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Collect the build, its checksums and its origin
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item target/release/akm.exe out/
          Copy-Item target/release/akm-desktop.exe out/
          Copy-Item target/release/bundle/nsis/*-setup.exe out/
          Copy-Item $env:DESKTOP_LIB_TESTS out/akm-desktop-lib-tests.exe
          # Only if the test build links the WebView2 loader dynamically: then it must sit beside the tests.
          $loader = Join-Path (Split-Path -Parent $env:DESKTOP_LIB_TESTS) 'WebView2Loader.dll'
          if (Test-Path $loader) { Copy-Item $loader out/ }
          $lines = Get-ChildItem out -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          $lines | Set-Content out/SHA256SUMS.txt -Encoding utf8NoBOM
          @(
            "commit=$env:GITHUB_SHA"
            "ref=$env:GITHUB_REF"
            "run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID attempt $env:GITHUB_RUN_ATTEMPT"
            "image=$env:ImageOS $env:ImageVersion"
            "rustc=$(rustc -V)"
            "node=$(node -v)"
            "unsigned development build: do not distribute"
          ) | Set-Content out/build-info.txt -Encoding utf8NoBOM
          Get-Content out/SHA256SUMS.txt, out/build-info.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-proof-build
          path: out/*
          if-no-files-found: error
          retention-days: 30

  real-clipboard:
    needs: build
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-proof-build
          path: ${{ runner.temp }}/build
      - name: Preflight (build hashes, session, empty clipboard)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci_native_preflight.ps1 -Artifacts "$env:RUNNER_TEMP\build" -Evidence "$env:RUNNER_TEMP\evidence" -NeedDesktop -NeedEmptyClipboard -DisposableRunner
      - name: Real clipboard test (AKM_TEST_REAL_CLIPBOARD=1)
        shell: pwsh
        run: |
          $env:AKM_TEST_REAL_CLIPBOARD = '1'
          $env:AKM_JOURNAL_ROOT = Join-Path $env:RUNNER_TEMP 'akm-test-journal'
          & "$env:RUNNER_TEMP\build\akm-desktop-lib-tests.exe" clipboard::windows::actual_windows_private_formats_are_present --ignored --exact *>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP\evidence\real-clipboard.txt"
          exit $LASTEXITCODE
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-proof-real-clipboard-${{ github.sha }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn

  full-gui-proof:
    needs: build
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-proof-build
          path: ${{ runner.temp }}/build
      - name: Preflight (build hashes, session, empty clipboard, WebView2)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci_native_preflight.ps1 -Artifacts "$env:RUNNER_TEMP\build" -Evidence "$env:RUNNER_TEMP\evidence" -NeedDesktop -NeedEmptyClipboard -NeedWebView2 -InstallWebView2 -DisposableRunner
      - name: Fetch KeePassXC, pinned by digest
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'keepassxc-download'
          New-Item -ItemType Directory $download | Out-Null
          $asset = "KeePassXC-$env:KEEPASSXC_VERSION-x64.zip"
          $url = "https://github.com/keepassxreboot/keepassxc/releases/download/$env:KEEPASSXC_VERSION/$asset"
          Invoke-WebRequest $url -OutFile (Join-Path $download $asset)
          Invoke-WebRequest "$url.DIGEST" -OutFile (Join-Path $download "$asset.DIGEST")
          $actual = (Get-FileHash (Join-Path $download $asset) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:KEEPASSXC_SHA256) { throw "KeePassXC digest $actual is not the pinned $env:KEEPASSXC_SHA256" }
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File tools/fetch_keepassxc.ps1 -Version $env:KEEPASSXC_VERSION -LocalZip (Join-Path $download $asset) -LocalDigest (Join-Path $download "$asset.DIGEST") -Destination (Join-Path $env:RUNNER_TEMP 'keepassxc')
          if ($LASTEXITCODE -ne 0) { throw "fetch_keepassxc.ps1 failed: $out" }
          $out | Tee-Object -FilePath "$env:RUNNER_TEMP\evidence\keepassxc.txt"
          $cli = ($out | Select-String '^CLI\s+(.+)$').Matches[0].Groups[1].Value.Trim()
          "KPXC_CLI=$cli" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Full native GUI proof (no skip switch)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/verify_windows_app.ps1 -DesktopExe "$env:RUNNER_TEMP\build\akm-desktop.exe" -CliExe "$env:RUNNER_TEMP\build\akm.exe" -KeePassXC "$env:KPXC_CLI" *>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP\evidence\full-gui-proof.txt"
          exit $LASTEXITCODE
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-proof-full-gui-${{ github.sha }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn

  r4-04-attempt:
    needs: build
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the R4-04 preconditions compare with cfeb1b0; without it they say so
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-proof-build
          path: ${{ runner.temp }}/build
      - name: Preflight (build hashes, session, empty clipboard, WebView2)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci_native_preflight.ps1 -Artifacts "$env:RUNNER_TEMP\build" -Evidence "$env:RUNNER_TEMP\evidence" -NeedDesktop -NeedEmptyClipboard -NeedWebView2 -InstallWebView2 -DisposableRunner
      # The preconditions of docs/FINDINGS.md "R4-04 pass conditions", step 1. They are recorded,
      # not enforced: the R4-04 proof script is not accepted (finding R4-04-SCRIPT), so no run of
      # this job passes R4-04, whatever the preconditions show.
      - name: Record the R4-04 preconditions
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\evidence\r4-04-preconditions.txt"
          git cat-file -e 'cfeb1b0^{commit}' 2>$null
          if ($LASTEXITCODE -ne 0) {
            "build inputs equal cfeb1b0: not known. Commit cfeb1b0 is not in this history (for example a one-commit public snapshot)." | Add-Content $log
          } else {
            git diff --quiet cfeb1b0 -- crates desktop Cargo.toml Cargo.lock tools ':(exclude)tools/verify_windows_app.ps1' ':(exclude)tools/ProofSnapshot.psm1' ':(exclude)tools/test_proof_snapshot.ps1'
            "build inputs equal cfeb1b0 (exit 0 means yes): exit $LASTEXITCODE" | Add-Content $log
          }
          "git status --porcelain -- crates desktop tools: [$(git status --porcelain -- crates desktop tools)]" | Add-Content $log
          foreach ($file in 'tools/verify_windows_app.ps1', 'tools/ProofSnapshot.psm1', 'tools/test_proof_snapshot.ps1') {
            "$file sha256=$((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()) last commit=$(git log -1 --format=%H -- $file)" | Add-Content $log
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/test_proof_snapshot.ps1 *>&1 | Add-Content $log
          "R4-04: not passed by this run. The proof script is not accepted (FINDINGS.md R4-04-SCRIPT, options A and B open)." | Add-Content $log
          Get-Content $log
          exit 0
      # -OwnerReadyForVisibility is the script's guard for the owner's computer. On this disposable
      # runner the owner's approval of the workflow rule (AGENTS.md) stands in for it.
      - name: R4-04 outcome proof (real minimize and restore)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/verify_windows_app.ps1 -DesktopExe "$env:RUNNER_TEMP\build\akm-desktop.exe" -CliExe "$env:RUNNER_TEMP\build\akm.exe" -OutcomeOnly -OwnerReadyForVisibility *>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP\evidence\r4-04-output.txt"
          exit $LASTEXITCODE
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-proof-r4-04-${{ github.sha }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn

  install-upgrade-uninstall:
    needs: build
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-proof-build
          path: ${{ runner.temp }}/build
      # No -InstallWebView2: on a clean computer the setup program installs WebView2 itself.
      - name: Preflight (build hashes, session)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci_native_preflight.ps1 -Artifacts "$env:RUNNER_TEMP\build" -Evidence "$env:RUNNER_TEMP\evidence\preflight" -NeedDesktop -DisposableRunner
      - name: Install, start, reinstall and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem "$env:RUNNER_TEMP\build" -Filter '*-setup.exe' | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/test_install.ps1 -Setup $setup.FullName -DesktopExe "$env:RUNNER_TEMP\build\akm-desktop.exe" -CliExe "$env:RUNNER_TEMP\build\akm.exe" -Evidence "$env:RUNNER_TEMP\evidence\install" -DisposableRunner *>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP\evidence\install-transcript.txt"
          exit $LASTEXITCODE
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-proof-install-${{ github.sha }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
