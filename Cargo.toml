[workspace]
resolver = "2"
members = ["crates/akm-core", "crates/akm-cli", "desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
dirs = "5"
keepass = { version = "=0.17.0", features = ["save_kdbx4"] }
rust-argon2 = "3"
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
